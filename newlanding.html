<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RiskxLabs — We Fight Fraud.</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0a0d0f;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 32px;
    }

    /* Neon X Logo */
    .logo-wrapper {
      position: relative;
      width: 280px;
      height: 280px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg.x-logo {
      width: 260px;
      height: 260px;
      filter: drop-shadow(0 0 18px #00e5ff) drop-shadow(0 0 40px #00b8d4);
    }

    svg.x-logo path {
      fill: none;
      stroke: #00e5ff;
      stroke-width: 10;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    svg.x-logo .circuit-line {
      stroke: #00e5ff;
      stroke-width: 2.5;
      opacity: 0.7;
    }

    svg.x-logo circle {
      fill: #00e5ff;
      opacity: 0.85;
    }

    /* Pulse animation */
    @keyframes pulse {
      0%, 100% { filter: drop-shadow(0 0 18px #00e5ff) drop-shadow(0 0 40px #00b8d4); }
      50% { filter: drop-shadow(0 0 28px #00e5ff) drop-shadow(0 0 60px #00e5ff); }
    }

    svg.x-logo {
      animation: pulse 3s ease-in-out infinite;
    }

    /* Text */
    .brand-name {
      font-size: 3rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .tagline {
      font-size: 1.25rem;
      font-weight: 400;
      color: #cccccc;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-top: -20px;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Neon Circuit X -->
    <div class="logo-wrapper">
      <svg class="x-logo" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg">
        <!-- Main X shape -->
        <path d="M30 20 L130 120 L230 20" />
        <path d="M30 240 L130 140 L230 240" />

        <!-- Inner X detail lines -->
        <line class="circuit-line" x1="55" y1="35" x2="130" y2="110" />
        <line class="circuit-line" x1="80" y1="30" x2="130" y2="100" />
        <line class="circuit-line" x1="205" y1="35" x2="130" y2="110" />
        <line class="circuit-line" x1="180" y1="30" x2="130" y2="100" />

        <line class="circuit-line" x1="55" y1="225" x2="130" y2="150" />
        <line class="circuit-line" x1="80" y1="230" x2="130" y2="160" />
        <line class="circuit-line" x1="205" y1="225" x2="130" y2="150" />
        <line class="circuit-line" x1="180" y1="230" x2="130" y2="160" />

        <!-- Circuit dots -->
        <circle cx="130" cy="130" r="4" />
        <circle cx="95" cy="95" r="3" />
        <circle cx="165" cy="95" r="3" />
        <circle cx="95" cy="165" r="3" />
        <circle cx="165" cy="165" r="3" />
        <circle cx="70" cy="55" r="2.5" />
        <circle cx="190" cy="55" r="2.5" />
        <circle cx="70" cy="205" r="2.5" />
        <circle cx="190" cy="205" r="2.5" />
      </svg>
    </div>

    <!-- Brand -->
    <div class="brand-name">RiskxLabs</div>
    <div class="tagline">We Fight Fraud.</div>

  </div>
</body>
</html>
